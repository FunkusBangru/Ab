name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK and Tools
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $ANDROID_ROOT/cmdline-tools"
            exit 1
          fi
          CMDLINE_DIR=$(dirname "$SDKMANAGER")
          echo "$CMDLINE_DIR" >> $GITHUB_PATH
          echo "$ANDROID_ROOT/platform-tools" >> $GITHUB_PATH
          echo "Found sdkmanager at: $SDKMANAGER"

          # Accept all SDK licenses cleanly
          printf 'y\n%.0s' {1..50} | "$SDKMANAGER" --licenses || true

          # Install pinned NDK and CMake
          "$SDKMANAGER" --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Download bundled runtime agent assets
        run: |
          mkdir -p dist/runtime-bundles
          curl -fL --retry 3 -o dist/runtime-bundles/pocketdev-agy-arm64-2026.09.1.tar.zst \
            "https://github.com/techjarves/Mobile-Harness/releases/download/runtime-2026.09.4/pocketdev-agy-arm64-2026.09.1.tar.zst"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Online Debug APK
        run: ./gradlew assembleOnlineDebug --no-daemon --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-online-debug-apk
          path: app/build/outputs/apk/online/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/online/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
